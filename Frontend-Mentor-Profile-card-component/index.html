<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Profile card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="image-container">
        <img src="./images/image-victor.jpg" alt="" id="victor" />
      </div>

      <h1>Victor Crest <span class="grey">26</span></h1>

      <p id="london">London</p>
      <div class="stats">
        <div class="followers">
          <p class="number">80K</p>
          <p class="type">Followers</p>
        </div>
        <div class="likes">
          <p class="number">803K</p>
          <p class="type">Likes</p>
        </div>
        <div class="photos">
          <p class="number">1.4K</p>
          <p class="type">Photos</p>
        </div>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">ikufisile Fopefoluwa</a>.
    </div>
  </body>
</html>
